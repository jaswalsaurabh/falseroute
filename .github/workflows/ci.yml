name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: falseroute
          POSTGRES_PASSWORD: falseroute
          POSTGRES_DB: falseroute_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject committed secrets and credentials
        run: pnpm check:secrets

      - name: Validate Prisma schema with migration guard
        run: pnpm guard:prisma

      - name: Run Prisma migration on test database
        run: pnpm --filter @false-route/database migrate:deploy

      - name: Verify repository governance & source policies
        run: pnpm check:repo

      - name: Verify 3-tier design token hierarchy
        run: pnpm check:design-tokens

      - name: Check code formatting
        run: pnpm format:check

      - name: Run static analysis & linting
        run: pnpm lint

      - name: Run strict TypeScript typechecks
        run: pnpm typecheck

      - name: Build all packages and applications
        run: pnpm build

      - name: Run unit test suites
        run: pnpm test

      - name: Run full integration & system integration suites
        run: pnpm test:integration

  containers:
    name: Production Container Security & Verification
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: falseroute
          POSTGRES_PASSWORD: falseroute
          POSTGRES_DB: falseroute_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production container builds, non-root user, and smoke behavior
        run: pnpm verify:containers
