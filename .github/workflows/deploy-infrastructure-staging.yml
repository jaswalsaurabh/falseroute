name: Infrastructure staging

on:
  workflow_dispatch:
    inputs:
      api_image_digest:
        description: API image digest (sha256:...)
        required: true
        type: string
      worker_image_digest:
        description: Worker image digest (sha256:...)
        required: true
        type: string
      web_image_digest:
        description: Web image digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read

env:
  TERRAFORM_DIR: infrastructure/terraform

jobs:
  plan:
    name: Plan staging infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_INFRASTRUCTURE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write infrastructure variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          TECHNICAL_OWNER: ${{ vars.TECHNICAL_OWNER }}
          SECURITY_APPROVER: ${{ vars.SECURITY_APPROVER }}
          INCIDENT_CONTACT_EMAIL: ${{ vars.INCIDENT_CONTACT_EMAIL }}
          ADR_0005_ACCEPTED: ${{ vars.ADR_0005_ACCEPTED }}
          BILLING_ACCOUNT_ID: ${{ vars.BILLING_ACCOUNT_ID }}
          ENABLE_DELETION_PROTECTION: ${{ vars.ENABLE_DELETION_PROTECTION }}
          ENABLE_CLOUDFLARE_DNS: ${{ vars.ENABLE_CLOUDFLARE_DNS }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          WORKER_IMAGE_DIGEST: ${{ inputs.worker_image_digest }}
          WEB_IMAGE_DIGEST: ${{ inputs.web_image_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "project_id": os.environ["GCP_PROJECT_ID"],
              "project_number": os.environ["GCP_PROJECT_NUMBER"],
              "region": os.environ["GCP_REGION"],
              "environment": "staging",
              "domain_name": os.environ["DOMAIN_NAME"],
              "technical_owner": os.environ["TECHNICAL_OWNER"],
              "security_approver": os.environ["SECURITY_APPROVER"],
              "incident_contact_email": os.environ["INCIDENT_CONTACT_EMAIL"],
              "adr_0005_accepted": os.environ["ADR_0005_ACCEPTED"].lower() == "true",
              "billing_account_id": os.environ["BILLING_ACCOUNT_ID"],
              "enable_deletion_protection": os.environ["ENABLE_DELETION_PROTECTION"].lower() == "true",
              "enable_cloudflare_dns": os.environ["ENABLE_CLOUDFLARE_DNS"].lower() == "true",
              "cloudflare_zone_id": os.environ["CLOUDFLARE_ZONE_ID"],
              "api_image_tag": os.environ["API_IMAGE_DIGEST"],
              "worker_image_tag": os.environ["WORKER_IMAGE_DIGEST"],
              "web_image_tag": os.environ["WEB_IMAGE_DIGEST"],
          }
          for key in ("api_image_tag", "worker_image_tag", "web_image_tag"):
              if not values[key].startswith("sha256:"):
                  raise SystemExit(f"{key} must be a sha256 digest")
          Path("infrastructure/terraform/deployment.auto.tfvars.json").write_text(
              json.dumps(values, indent=2) + "\n"
          )
          PY

      - name: Initialize Terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: Check Terraform formatting
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: Create Terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform plan -input=false -out=staging.tfplan

      - name: Upload infrastructure plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-infrastructure-plan-${{ github.run_id }}
          path: |
            infrastructure/terraform/staging.tfplan
            infrastructure/terraform/deployment.auto.tfvars.json
          retention-days: 3

  apply:
    name: Apply approved staging infrastructure
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-infrastructure
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: staging-infrastructure-plan-${{ github.run_id }}
          path: infrastructure/terraform

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_INFRASTRUCTURE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: Apply approved Terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -input=false -auto-approve staging.tfplan
