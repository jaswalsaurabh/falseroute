# Provisional Cloud Run Service Template for FalseRoute API
# Target: Google Cloud Run (Fully Managed)
# Single-instance constraint is enforced because rate limiting, load shedding, and spend controls are process-local.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: falseroute-api
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/name: falseroute-api
    app.kubernetes.io/part-of: falseroute
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        # Temporary safety constraints: process-local rate limits and overload guards require single instance
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: falseroute-api-sa@${PROJECT_ID}.iam.gserviceaccount.com
      timeoutSeconds: 60
      containerConcurrency: 80
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/falseroute/falseroute-api:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: '1000m'
              memory: '512Mi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: LOG_LEVEL
              value: 'info'
            - name: PORT
              value: '3000'
            - name: CORS_ORIGINS
              value: 'https://dashboard.example.com'
            - name: SYSTEM_MODE
              value: 'SIMULATED'
            - name: SHUTDOWN_TIMEOUT_MS
              value: '8000'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: falseroute-api-secrets
                  key: database_url
            - name: OPERATOR_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: falseroute-api-secrets
                  key: operator_access_token
          startupProbe:
            httpGet:
              path: /api/v1/ready
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
