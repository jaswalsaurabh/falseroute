# Provisional Cloud Run Service Template for FalseRoute Operator Web UI
# Serves static assets via lightweight non-root Node HTTP server.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: falseroute-web
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/name: falseroute-web
    app.kubernetes.io/part-of: falseroute
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: falseroute-web-sa@${PROJECT_ID}.iam.gserviceaccount.com
      timeoutSeconds: 30
      containerConcurrency: 100
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/falseroute/falseroute-web:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '500m'
              memory: '256Mi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '8080'
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
