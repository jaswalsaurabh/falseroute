# Provisional Cloud Run Service Template for FalseRoute Background Worker
# Configured for continuous background event processing and transactional polling.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: falseroute-worker
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/name: falseroute-worker
    app.kubernetes.io/part-of: falseroute
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        # Minimum 1 instance to maintain continuous polling loop
        autoscaling.knative.dev/minScale: '1'
        # Single instance constraint while concurrency and spend controls are process-local
        autoscaling.knative.dev/maxScale: '1'
        # Always allocate CPU outside requests for background polling
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: falseroute-worker-sa@${PROJECT_ID}.iam.gserviceaccount.com
      timeoutSeconds: 300
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/falseroute/falseroute-worker:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1000m'
              memory: '512Mi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: LOG_LEVEL
              value: 'info'
            - name: PORT
              value: '8080'
            - name: WORKER_POLL_INTERVAL_MS
              value: '500'
            - name: WORKER_CLAIM_LEASE_MS
              value: '15000'
            - name: WORKER_CLAIM_PERSISTENCE_MARGIN_MS
              value: '5000'
            - name: GEMINI_OPERATION_DEADLINE_MS
              value: '8000'
            - name: GEMINI_MODEL
              value: 'gemini-3.5-flash'
            - name: WORKER_SHUTDOWN_TIMEOUT_MS
              value: '8000'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: falseroute-worker-secrets
                  key: database_url
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: falseroute-worker-secrets
                  key: gemini_api_key
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
