# Local development infrastructure only.
# This compose file is not an alternative production deployment configuration.

services:
  pubsub:
    build:
      context: .
      dockerfile: pubsub-emulator.Dockerfile
    container_name: falseroute-pubsub-emulator
    restart: unless-stopped
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=falseroute-local
      - --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8085),2); s.close()
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18.4
    container_name: falseroute-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: falseroute
      POSTGRES_PASSWORD: falseroute
      POSTGRES_DB: falseroute_dev
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - falseroute_postgres_data:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U falseroute -d falseroute_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  falseroute_postgres_data:
    name: falseroute_postgres_data
